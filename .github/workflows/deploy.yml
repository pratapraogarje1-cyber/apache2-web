- name: Configure SSH
  env
    EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    EC2_HOST: ${{ secrets.EC2_HOST }}
  run: |
    set -eu

    mkdir -p "$HOME/.ssh"
    chmod 700 "$HOME/.ssh"

    printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
    chmod 600 "$HOME/.ssh/deploy_key"

    test -s "$HOME/.ssh/deploy_key"
    ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

    ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
    chmod 600 "$HOME/.ssh/known_hosts"
