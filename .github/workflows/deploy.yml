
name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html styles.css script.js \
            "$EC2_USER@$EC2_HOST:/tmp/portfolio-deploy/"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'sudo install -d -o ubuntu -g ubuntu /var/www/portfolio &&
             cp /tmp/portfolio-deploy/index.html /var/www/portfolio/ &&
             cp /tmp/portfolio-deploy/styles.css /var/www/portfolio/ &&
             cp /tmp/portfolio-deploy/script.js /var/www/portfolio/'
